:"Al-Masad",ar:"المسد",mean:"The Palm Fiber",words:[["تَبَّتْ","tabbat","perished","ধ্বংস হোক",1],["يَدَا","yada","the two hands of","দুই হাত",1],["أَبِي","abee","Abu","আবুর",1],["لَهَبٍ","lahab","Lahab","লাহাবের",1],["وَتَبَّ","wa tabb","and he (himself) perished","এবং সেও ধ্বংস হোক",1],["أَغْنَىٰ","aghna","availed","উপকারে এল",2],["كَسَبَ","kasaba","he earned","সে উপার্জন করেছে",2],["سَيَصْلَىٰ","sayasla","he will burn in","সে প্রবেশ করবে",3],["ذَاتَ","dhata","having","অধিকারী",3],["وَامْرَأَتُهُ","wa imra'atuhu","and his wife","এবং তার স্ত্রী",4],["حَمَّالَةَ","hammalata","the carrier of","বহনকারিণী",4],["الْحَطَبِ","al-hatab","firewood","কাঠের",4],["جِيدِهَا","jeediha","her neck","তার গলায়",5],["حَبْلٌ","hablun","a rope","একটি রশি",5],["مَّسَدٍ","masad","palm fiber","খেজুর আঁশের",5]]},{n:112,name:"Al-Ikhlas",ar:"الإخلاص",mean:"Sincerity",words:[["الصَّمَدُ","as-samad","the Self-Sufficient","চিরসত্তা",2],["يَلِدْ","yalid","He begets","জন্ম দেন",3],["وَلَمْ","wa lam","and not","এবং না",3],["يُولَدْ","yoolad","He is begotten","তাঁকে জন্ম দেওয়া হয়েছে",3],["يَكُن","yakun","there is","হয়েছে",4],["كُفُوًا","kufuwan","equivalent","সমতুল্য",4]]},{n:113,name:"Al-Falaq",ar:"الفلق",mean:"The Daybreak",words:[["أَعُوذُ","aʿoodhu","I seek refuge","আমি আশ্রয় নিচ্ছি",1],["بِرَبِّ","bi rabbi","in the Lord of","রবের",1],["الْفَلَقِ","al-falaq","the daybreak","প্রভাতের",1],["شَرِّ","sharri","the evil of","অনিষ্ট থেকে",2],["وَمِن","wa min","and from","এবং থেকে",3],["غَاسِقٍ","ghasiq","darkness","অন্ধকারের",3],["وَقَبَ","waqaba","it settles","তা বিস্তার লাভ করে",3],["النَّفَّاثَاتِ","an-naffathat","the blowers/witches","জাদুকরীদের",4],["الْعُقَدِ","al-ʿuqad","the knots","গিরায়",4],["حَاسِدٍ","hasid","an envier","হিংসুকের",5],["حَسَدَ","hasada","he envies","সে হিংসা করে",5]]},{n:114,name:"An-Nas",ar:"الناس",mean:"Mankind",words:[["مَلِكِ","maliki","the King of","বাদশাহ",2],["إِلَٰهِ","ilahi","the God of","মালিক/উপাস্য",3],["الْوَسْوَاسِ","al-waswas","the whisperer","কুমন্ত্রণাদাতার",4],["الْخَنَّاسِ","al-khannas","who withdraws","যে সরে যায়",4],["يُوَسْوِسُ","yuwaswisu","whispers","কুমন্ত্রণা দেয়",5],["صُدُورِ","sudoor","the breasts of","বুকে",5],["الْجِنَّةِ","al-jinnah","the jinn","জিনের",6],["وَالنَّاسِ","wan-nas","and mankind","এবং মানুষের",6]]}],VERSES={78:[{a:1,ar:"عَمَّ يَتَسَاءَلُونَ",en:"About what are they asking one another?"},{a:2,ar:"عَنِ النَّبَإِ الْعَظِيمِ",en:"About the great news,"},{a:3,ar:"الَّذِي هُمْ فِيهِ مُخْتَلِفُونَ",en:"about which they are in disagreement."},{a:4,ar:"كَلَّا سَيَعْلَمُونَ",en:"No! They will come to know."},{a:5,ar:"ثُمَّ كَلَّا سَيَعْلَمُونَ",en:"Then again, no! They will come to know."},{a:6,ar:"أَلَمْ نَجْعَلِ الْأَرْضَ مِهَادًا",en:"Have We not made the earth a resting place,"},{a:7,ar:"وَالْجِبَالَ أَوْتَادًا",en:"and the mountains as pegs?"},{a:8,ar:"وَخَلَقْنَاكُمْ أَزْوَاجًا",en:"And We created you in pairs,"},{a:9,ar:"وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا",en:"and made your sleep for rest,"},{a:10,ar:"وَجَعَلْنَا اللَّيْلَ لِبَاسًا",en:"and made the night a covering,"},{a:11,ar:"وَجَعَلْنَا النَّهَارَ مَعَاشًا",en:"and made the day for livelihood."},{a:12,ar:"وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا",en:"And We built above you seven strong heavens,"},{a:13,ar:"وَجَعَلْنَا سِرَاجًا وَهَّاجًا",en:"and made a blazing lamp,"},{a:14,ar:"وَأَنْزَلْنَا مِنَ الْمُعْصِرَاتِ مَاءً ثَجَّاجًا",en:"and sent down abundant rain from the rainclouds,"},{a:15,ar:"لِنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا",en:"that We may bring forth by it grain and vegetation,"},{a:16,ar:"وَجَنَّاتٍ أَلْفَافًا",en:"and dense gardens."},{a:17,ar:"إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا",en:"Indeed, the Day of Judgment is an appointed time,"},{a:18,ar:"يَوْمَ يُنْفَخُ فِي الصُّورِ فَتَأْتُونَ أَفْوَاجًا",en:"the Day the Trumpet is blown and you come forth in crowds,"},{a:19,ar:"وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا",en:"and the sky is opened and becomes gateways,"},{a:20,ar:"وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا",en:"and the mountains are set in motion and become a mirage."},{a:21,ar:"إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا",en:"Indeed, Hell is ever a watching place,"},{a:22,ar:"لِلطَّاغِينَ مَآبًا",en:"a place of return for the transgressors,"},{a:23,ar:"لَابِثِينَ فِيهَا أَحْقَابًا",en:"in which they will remain for ages,"},{a:24,ar:"لَا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا",en:"tasting therein neither coolness nor drink,"},{a:25,ar:"إِلَّا حَمِيمًا وَغَسَّاقًا",en:"except scalding water and foul fluid —"},{a:26,ar:"جَزَاءً وِفَاقًا",en:"a fitting recompense."},{a:27,ar:"إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا",en:"Indeed, they did not expect an accounting,"},{a:28,ar:"وَكَذَّبُوا بِآيَاتِنَا كِذَّابًا",en:"and they denied Our signs, wholly denying them."},{a:29,ar:"وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا",en:"But We have recorded every single thing in a book."},{a:30,ar:"فَذُوقُوا فَلَنْ نَزِيدَكُمْ إِلَّا عَذَابًا",en:"So taste [the punishment], for We will never increase you except in torment."},{a:31,ar:"إِنَّ لِلْمُتَّقِينَ مَفَازًا",en:"Indeed, for the righteous is attainment —"},{a:32,ar:"حَدَائِقَ وَأَعْنَابًا",en:"gardens and grapevines,"},{a:33,ar:"وَكَواعِبَ أَتْرَابًا",en:"and companions of equal age,"},{a:34,ar:"وَكَأْسًا دِهَاقًا",en:"and an overflowing cup."},{a:35,ar:"لَا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا",en:"They will hear therein no vain talk or lying —"},{a:36,ar:"جَزَاءً مِنْ رَبِّكَ عَطَاءً حِسَابًا",en:"a reward from your Lord, a fitting gift."},{a:37,ar:"رَبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ لَا يَمْلِكُونَ مِنْهُ خِطَابًا",en:"The Lord of the heavens and the earth and what is between them, the Most Merciful — none can address Him."},{a:38,ar:"يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا لَا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ الرَّحْمَٰنُ وَقَالَ صَوَابًا",en:"The Day the Spirit and the angels stand in rows, none will speak except one whom the Most Merciful permits, and he will say what is right."},{a:39,ar:"ذَٰلِكَ الْيَوْمُ الْحَقُّ فَمَنْ شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا",en:"That is the True Day, so whoever wills may take a way of return to his Lord."},{a:40,ar:"إِنَّا أَنْذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنْظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ الْكَافِرُ يَا لَيْتَنِي كُنْتُ تُرَابًا",en:"Indeed, We have warned you of an imminent punishment — the Day when a person will see what his hands have sent forth, and the disbeliever will say, 'Oh, I wish I were dust!'"}],79:[{a:1,ar:"وَالنَّازِعَاتِ غَرْقًا",en:"By those [angels] who extract violently,"},{a:2,ar:"وَالنَّاشِطَاتِ نَشْطًا",en:"and those who draw out gently,"},{a:3,ar:"وَالسَّابِحَاتِ سَبْحًا",en:"and those who glide swiftly,"},{a:4,ar:"فَالسَّابِقَاتِ سَبْقًا",en:"and those who race ahead swiftly,"},{a:5,ar:"فَالْمُدَبِّرَاتِ أَمْرًا",en:"and those who arrange each matter."},{a:6,ar:"يَوْمَ تَرْجُفُ الرَّاجِفَةُ",en:"On the Day the quaking blast quakes,"},{a:7,ar:"تَتْبَعُهَا الرَّادِفَةُ",en:"followed by the subsequent one,"},{a:8,ar:"قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ",en:"hearts, that Day, will tremble,"},{a:9,ar:"أَبْصَارُهَا خَاشِعَةٌ",en:"their eyes humbled."},{a:10,ar:"يَقُولُونَ أَإِنَّا لَمَرْدُودُونَ فِي الْحَافِرَةِ",en:"They say, 'Will we indeed be returned to our former state,"},{a:11,ar:"أَإِذَا كُنَّا عِظَامًا نَخِرَةً",en:"even after we have become decayed bones?'"},{a:12,ar:"قَالُوا تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ",en:"They say, 'That, then, would be a losing return.'"},{a:13,ar:"فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ",en:"But it will only be a single blast,"},{a:14,ar:"فَإِذَا هُمْ بِالسَّاهِرَةِ",en:"and behold, they will be awakened [on the surface]."},{a:15,ar:"هَلْ أَتَاكَ حَدِيثُ مُوسَىٰ",en:"Has the story of Moses reached you?"},{a:16,ar:"إِذْ نَادَاهُ رَبُّهُ بِالْوَادِ الْمُقَدَّسِ طُوًى",en:"When his Lord called him in the sacred valley of Tuwa,"},{a:17,ar:"اذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ",en:"'Go to Pharaoh; indeed, he has transgressed.'"},{a:18,ar:"فَقُلْ هَلْ لَكَ إِلَىٰ أَنْ تَزَكَّىٰ",en:"And say to him, 'Would you purify yourself,"},{a:19,ar:"وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ",en:"and I guide you to your Lord so that you may fear Him?'"},{a:20,ar:"فَأَرَاهُ الْآيَةَ الْكُبْرَىٰ",en:"And he showed him the greatest sign,"},{a:21,ar:"فَكَذَّبَ وَعَصَىٰ",en:"but he denied it and disobeyed."},{a:22,ar:"ثُمَّ أَدْبَرَ يَسْعَىٰ",en:"Then he turned away, striving [against the truth]."},{a:23,ar:"فَحَشَرَ فَقَالَ",en:"He gathered [his people] and proclaimed,"},{a:24,ar:"فَقَالَ أَنَا رَبُّكُمُ الْأَعْلَىٰ",en:"saying, 'I am your lord, most high.'"},{a:25,ar:"فَأَخَذَهُ اللَّهُ نَكَالَ الْآخِرَةِ وَالْأُولَىٰ",en:"So Allah seized him with the punishment of the last and the first [transgression]."},{a:26,ar:"إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِمَنْ يَخْشَىٰ",en:"Indeed, in that is a lesson for whoever fears [Allah]."},{a:27,ar:"أَأَنْتُمْ أَشَدُّ خَلْقًا أَمِ السَّمَاءُ بَنَاهَا",en:"Are you more difficult to create, or is the heaven? He built it."},{a:28,ar:"رَفَعَ سَمْكَهَا فَسَوَّاهَا",en:"He raised its ceiling and proportioned it,"},{a:29,ar:"وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَاهَا",en:"and He darkened its night and brought out its brightness."},{a:30,ar:"وَالْأَرْضَ بَعْدَ ذَلِكَ دَحَاهَا",en:"And the earth after that He spread out."},{a:31,ar:"أَخْرَجَ مِنْهَا مَاءَهَا وَمَرْعَاهَا",en:"He brought forth from it its water and its pasture,"},{a:32,ar:"وَالْجِبَالَ أَرْسَاهَا",en:"and the mountains He set firmly,"},{a:33,ar:"مَتَاعًا لَكُمْ وَلِأَنْعَامِكُمْ",en:"as provision for you and your livestock."},{a:34,ar:"فَإِذَا جَاءَتِ الطَّامَّةُ الْكُبْرَىٰ",en:"So when the greatest catastrophe comes —"},{a:35,ar:"يَوْمَ يَتَذَكَّرُ الْإِنْسَانُ مَا سَعَىٰ",en:"the Day when man will remember what he strove for,"},{a:36,ar:"وَبُرِّزَتِ الْجَحِيمُ لِمَنْ يَرَىٰ",en:"and the Blazing Fire will be manifested for all to see —"},{a:37,ar:"فَأَمَّا مَنْ طَغَىٰ",en:"then as for one who transgressed"},{a:38,ar:"وَآثَرَ الْحَيَاةَ الدُّنْيَا",en:"and preferred the worldly life,"},{a:39,ar:"فَإِنَّ الْجَحِيمَ هِيَ الْمَأْوَىٰ",en:"the Blazing Fire will be his abode."},{a:40,ar:"وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ",en:"But as for one who feared standing before his Lord and restrained himself from vain desire,"},{a:41,ar:"فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ",en:"Paradise will be his abode."},{a:42,ar:"يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا",en:"They ask you about the Hour, when it will arrive."},{a:43,ar:"فِيمَ أَنْتَ مِنْ ذِكْرَاهَا",en:"You have no knowledge to tell of it."},{a:44,ar:"إِلَىٰ رَبِّكَ مُنْتَهَاهَا",en:"To your Lord belongs its finality."},{a:45,ar:"إِنَّمَا أَنْتَ مُنْذِرُ مَنْ يَخْشَاهَا",en:"You are only a warner for those who fear it."},{a:46,ar:"كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا",en:"On the Day they see it, it will be as if they had remained only an evening or a morning."}],80:[{a:1,ar:"عَبَسَ وَتَوَلَّىٰ",en:"He frowned and turned away"},{a:2,ar:"أَنْ جَاءَهُ الْأَعْمَىٰ",en:"because the blind man came to him."},{a:3,ar:"وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّىٰ",en:"But what could tell you — perhaps he might be purified,"},{a:4,ar:"أَوْ يَذَّكَّرُ فَتَنفَعَهُ الذِّكْرَىٰ",en:"or he might be reminded and the reminder would benefit him."},{a:5,ar:"أَمَّا مَنِ اسْتَغْنَىٰ",en:"But as for one who thinks himself free of need,"},{a:6,ar:"فَأَنْتَ لَهُ تَصَدَّىٰ",en:"to him you attend."},{a:7,ar:"وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ",en:"Yet it is not your concern if he does not become purified."},{a:8,ar:"وَأَمَّا مَنْ جَاءَكَ يَسْعَىٰ",en:"But as for one who came to you striving [for guidance],"},{a:9,ar:"وَهُوَ يَخْشَىٰ",en:"while he fears [Allah],"},{a:10,ar:"فَأَنْتَ عَنْهُ تَلَهَّىٰ",en:"from him you are distracted."},{a:11,ar:"كَلَّا إِنَّهَا تَذْكِرَةٌ",en:"No! Indeed, it is a reminder,"},{a:12,ar:"فَمَنْ شَاءَ ذَكَرَهُ",en:"so whoever wills may remember it,"},{a:13,ar:"فِي صُحُفٍ مُكَرَّمَةٍ",en:"[recorded] in honored scrolls,"},{a:14,ar:"مَرْفُوعَةٍ مُطَهَّرَةٍ",en:"exalted and purified,"},{a:15,ar:"بِأَيْدِي سَفَرَةٍ",en:"in the hands of scribes"},{a:16,ar:"كِرَامٍ بَرَرَةٍ",en:"who are noble and righteous."},{a:17,ar:"قُتِلَ الْإِنسَانُ مَا أَكْفَرَهُ",en:"Cursed is man! How ungrateful he is."},{a:18,ar:"مِنْ أَيِّ شَيْءٍ خَلَقَهُ",en:"From what thing did He create him?"},{a:19,ar:"مِنْ نُطْفَةٍ خَلَقَهُ فَقَدَّرَهُ",en:"From a sperm-drop He created him and proportioned him,"},{a:20,ar:"ثُمَّ السَّبِيلَ يَسَّرَهُ",en:"then made the way easy for him."},{a:21,ar:"ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ",en:"Then He causes him to die and buries him,"},{a:22,ar:"ثُمَّ إِذَا شَاءَ أَنْشَرَهُ",en:"then when He wills, He will resurrect him."},{a:23,ar:"كَلَّا لَمَّا يَقْضِ مَا أَمَرَهُ",en:"Yet man has not fulfilled what He commanded him."},{a:24,ar:"فَلْيَنظُرِ الْإِنسَانُ إِلَىٰ طَعَامِهِ",en:"Let man reflect on his food —"},{a:25,ar:"أَنَّا صَبَبْنَا الْمَاءَ صَبًّا",en:"how We poured down the rain abundantly,"},{a:26,ar:"ثُمَّ شَقَقْنَا الْأَرْضَ شَقًّا",en:"then split the earth open,"},{a:27,ar:"فَأَنبَتْنَا فِيهَا حَبًّا",en:"and caused therein grain to grow,"},{a:28,ar:"وَعِنَبًا وَقَضْبًا",en:"and grapes and vegetables,"},{a:29,ar:"وَزَيْتُونًا وَنَخْلًا",en:"and olives and date palms,"},{a:30,ar:"وَحَدَائِقَ غُلْبًا",en:"and dense gardens,"},{a:31,ar:"وَفَاكِهَةً وَأَبًّا",en:"and fruit and herbage,"},{a:32,ar:"مَتَاعًا لَكُمْ وَلِأَنْعَامِكُمْ",en:"as enjoyment for you and your livestock."},{a:33,ar:"فَإِذَا جَاءَتِ الصَّاخَّةُ",en:"Then when the deafening blast comes,"},{a:34,ar:"يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ",en:"the Day a man will flee from his brother,"},{a:35,ar:"وَأُمِّهِ وَأَبِيهِ",en:"and his mother and his father,"},{a:36,ar:"وَصَاحِبَتِهِ وَبَنِيهِ",en:"and his wife and his children —"},{a:37,ar:"لِكُلِّ امْرِئٍ مِنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ",en:"each one of them, that Day, will have a concern enough to occupy him."},{a:38,ar:"وُجُوهٌ يَوْمَئِذٍ مُسْتَبْشِرَةٌ",en:"Some faces, that Day, will be beaming,"},{a:39,ar:"ضَاحِكَةٌ مُسْتَبْشِرَةٌ",en:"laughing and rejoicing;"},{a:40,ar:"وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ",en:"and other faces, that Day, will have dust upon them,"},{a:41,ar:"تَرْهَقُهَا قَتَرَةٌ",en:"overcast with darkness."},{a:42,ar:"أُولَٰئِكَ الْكَفَرَةُ الْفَجَرَةُ",en:"Those are the disbelievers, the wicked."}],81:[{a:1,ar:"إِذَا الشَّمْسُ كُوِّرَتْ",en:"When the sun is wrapped up [in darkness],"},{a:2,ar:"وَإِذَا النُّجُومُ انكَدَرَتْ",en:"and when the stars fall, dispersing,"},{a:3,ar:"وَإِذَا الْجِبَالُ سُيِّرَتْ",en:"and when the mountains are moved away,"},{a:4,ar:"وَإِذَا الْعِشَارُ عُطِّلَتْ",en:"and when the pregnant camels are neglected,"},{a:5,ar:"وَإِذَا الْوُحُوشُ حُشِرَتْ",en:"and when the wild beasts are gathered,"},{a:6,ar:"وَإِذَا الْبِحَارُ سُجِّرَتْ",en:"and when the seas are set on fire,"},{a:7,ar:"وَإِذَا النُّفُوسُ زُوِّجَتْ",en:"and when souls are paired [with their like],"},{a:8,ar:"وَإِذَا الْمَوْءُودَةُ سُئِلَتْ",en:"and when the female infant buried alive is asked,"},{a:9,ar:"بِأَيِّ ذَنبٍ قُتِلَتْ",en:"for what sin she was killed,"},{a:10,ar:"وَإِذَا الصُّحُفُ نُشِرَتْ",en:"and when the pages are unrolled,"},{a:11,ar:"وَإِذَا السَّمَاءُ كُشِطَتْ",en:"and when the sky is stripped away,"},{a:12,ar:"وَإِذَا الْجَحِيمُ سُعِّرَتْ",en:"and when the Blazing Fire is set ablaze,"},{a:13,ar:"وَإِذَا الْجَنَّةُ أُزْلِفَتْ",en:"and when Paradise is brought near —"},{a:14,ar:"عَلِمَتْ نَفْسٌ مَا أَحْضَرَتْ",en:"every soul will know what it has brought."},{a:15,ar:"فَلَا أُقْسِمُ بِالْخُنَّسِ",en:"So I swear by the retreating planets,"},{a:16,ar:"الْجَوَارِ الْكُنَّسِ",en:"running and disappearing,"},{a:17,ar:"وَاللَّيْلِ إِذَا عَسْعَسَ",en:"and by the night as it departs,"},{a:18,ar:"وَالصُّبْحِ إِذَا تَنَفَّسَ",en:"and by the dawn as it breathes —"},{a:19,ar:"إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ",en:"indeed, this [Quran] is truly the word of a noble messenger,"},{a:20,ar:"ذِي قُوَّةٍ عِندَ ذِي الْعَرْشِ مَكِينٍ",en:"possessor of strength, secure in position with the Owner of the Throne,"},{a:21,ar:"مُطَاعٍ ثَمَّ أَمِينٍ",en:"obeyed there, and trustworthy."},{a:22,ar:"وَمَا صَاحِبُكُم بِمَجْنُونٍ",en:"And your companion [Muhammad] is not mad."},{a:23,ar:"وَلَقَدْ رَآهُ بِالْأُفُقِ الْمُبِينِ",en:"He certainly saw him [Gabriel] on the clear horizon."},{a:24,ar:"وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِينٍ",en:"And he does not withhold [knowledge of] the unseen."},{a:25,ar:"وَمَا هُوَ بِقَوْلِ شَيْطَانٍ رَجِيمٍ",en:"Nor is it the word of an expelled devil."},{a:26,ar:"فَأَيْنَ تَذْهَبُونَ",en:"So where are you going?"},{a:27,ar:"إِنْ هُوَ إِلَّا ذِكْرٌ لِلْعَالَمِينَ",en:"It is nothing but a reminder to the worlds,"},{a:28,ar:"لِمَنْ شَاءَ مِنْكُمْ أَنْ يَسْتَقِيمَ",en:"for whoever among you wills to take a straight path."},{a:29,ar:"وَمَا تَشَاءُونَ إِلَّا أَنْ يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ",en:"But you cannot will except that Allah wills — Lord of the worlds."}],82:[{a:1,ar:"إِذَا السَّمَاءُ انفَطَرَتْ",en:"When the sky breaks apart,"},{a:2,ar:"وَإِذَا الْكَوَاكِبُ انتَثَرَتْ",en:"and when the stars fall, scattering,"},{a:3,ar:"وَإِذَا الْبِحَارُ فُجِّرَتْ",en:"and when the seas burst forth,"},{a:4,ar:"وَإِذَا الْقُبُورُ بُعْثِرَتْ",en:"and when the graves are overturned —"},{a:5,ar:"عَلِمَتْ نَفْسٌ مَا قَدَّمَتْ وَأَخَّرَتْ",en:"every soul will know what it has sent forth and left behind."},{a:6,ar:"يَا أَيُّهَا الْإِنسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ",en:"O man, what has deceived you concerning your Lord, the Generous,"},{a:7,ar:"الَّذِي خَلَقَكَ فَسَوَّاكَ فَعَدَلَكَ",en:"who created you, proportioned you, and balanced you,"},{a:8,ar:"فِي أَيِّ صُورَةٍ مَا شَاءَ رَكَّبَكَ",en:"and assembled you in whatever form He willed?"},{a:9,ar:"كَلَّا بَلْ تُكَذِّبُونَ بِالدِّينِ",en:"No! Rather, you deny the Judgment."},{a:10,ar:"وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ",en:"And indeed, over you are guardians —"},{a:11,ar:"كِرَامًا كَاتِبِينَ",en:"noble recorders,"},{a:12,ar:"يَعْلَمُونَ مَا تَفْعَلُونَ",en:"who know whatever you do."},{a:13,ar:"إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ",en:"Indeed, the righteous will be in bliss,"},{a:14,ar:"وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ",en:"and indeed, the wicked will be in a blazing fire,"},{a:15,ar:"يَصْلَوْنَهَا يَوْمَ الدِّينِ",en:"which they will enter on the Day of Judgment,"},{a:16,ar:"وَمَا هُم عَنْهَا بِغَائِبِينَ",en:"and they will not be absent from it."},{a:17,ar:"وَمَا أَدْرَاكَ مَا يَوْمُ الدِّينِ",en:"And what can make you know what the Day of Judgment is?"},{a:18,ar:"ثُمَّ مَا أَدْرَاكَ مَا يَوْمُ الدِّينِ",en:"Then, again, what can make you know what the Day of Judgment is?"},{a:19,ar:"يَوْمَ لَا تَمْلِكُ نَفْسٌ لِنَفْسٍ شَيْئًا وَالْأَمْرُ يَوْمَئِذٍ لِلَّهِ",en:"It is the Day when no soul will have power to do anything for another soul, and the command, that Day, belongs entirely to Allah."}],83:[{a:1,ar:"وَيْلٌ لِلْمُطَفِّفِينَ",en:"Woe to those who give less [than due],"},{a:2,ar:"الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ",en:"who, when they take a measure from people, demand it in full,"},{a:3,ar:"وَإِذَا كَالُوهُمْ أَوْ وَزَنُوهُمْ يُخْسِرُونَ",en:"but when they measure or weigh for others, they give less."},{a:4,ar:"أَلَا يَظُنُّ أُولَٰئِكَ أَنَّهُمْ مَبْعُوثُونَ",en:"Do they not think that they will be resurrected"},{a:5,ar:"لِيَوْمٍ عَظِيمٍ",en:"for a great Day,"},{a:6,ar:"يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ",en:"the Day when mankind will stand before the Lord of the worlds?"},{a:7,ar:"كَلَّا إِنَّ كِتَابَ الْفُجَّارِ لَفِي سِجِّينٍ",en:"No! Indeed, the record of the wicked is in Sijjin."},{a:8,ar:"وَمَا أَدْرَاكَ مَا سِجِّينٌ",en:"And what can make you know what Sijjin is?"},{a:9,ar:"كِتَابٌ مَرْقُومٌ",en:"It is a written record."},{a:10,ar:"وَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ",en:"Woe, that Day, to the deniers,"},{a:11,ar:"الَّذِينَ يُكَذِّبُونَ بِيَوْمِ الدِّينِ",en:"who deny the Day of Judgment."},{a:12,ar:"وَمَا يُكَذِّبُ بِهِ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ",en:"And none deny it except every sinful transgressor."},{a:13,ar:"إِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا قَالَ أَسَاطِيرُ الْأَوَّلِينَ",en:"When Our verses are recited to him, he says, 'Tales of the former peoples.'"},{a:14,ar:"كَلَّا بَلْ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا يَكْسِبُونَ",en:"No! Rather, what they used to earn has covered their hearts."},{a:15,ar:"كَلَّا إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ",en:"No! Indeed, that Day they will be veiled from their Lord."},{a:16,ar:"ثُمَّ إِنَّهُمْ لَصَالُوا الْجَحِيمِ",en:"Then indeed, they will burn in the Blazing Fire."},{a:17,ar:"ثُمَّ يُقَالُ هَٰذَا الَّذِي كُنتُم بِهِ تُكَذِّبُونَ",en:"Then it will be said, 'This is what you used to deny.'"},{a:18,ar:"كَلَّا إِنَّ كِتَابَ الْأَبْرَارِ لَفِي عِلِّيِّينَ",en:"No! Indeed, the record of the righteous is in 'Illiyyin."},{a:19,ar:"وَمَا أَدْرَاكَ مَا عِلِّيُّونَ",en:"And what can make you know what 'Illiyyin is?"},{a:20,ar:"كِتَابٌ مَرْقُومٌ",en:"It is a written record,"},{a:21,ar:"يَشْهَدُهُ الْمُقَرَّبُونَ",en:"witnessed by those brought near [to Allah]."},{a:22,ar:"إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ",en:"Indeed, the righteous will be in bliss,"},{a:23,ar:"عَلَى الْأَرَائِكِ يَنظُرُونَ",en:"on couches, gazing."},{a:24,ar:"تَعْرِفُ فِي وُجُوهِهِمْ نَضْرَةَ النَّعِيمِ",en:"You will recognize in their faces the radiance of bliss."},{a:25,ar:"يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ",en:"They will be given to drink from a sealed, pure wine,"},{a:26,ar:"خِتَامُهُ مِسْكٌ وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ",en:"whose seal is musk — and for that let the competitors compete."},{a:27,ar:"وَمِزَاجُهُ مِن تَسْنِيمٍ",en:"Its mixture is of Tasnim,"},{a:28,ar:"عَيْنًا يَشْرَبُ بِهَا الْمُقَرَّبُونَ",en:"a spring from which those brought near will drink."},{a:29,ar:"إِنَّ الَّذِينَ أَجْرَمُوا كَانُوا مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ",en:"Indeed, those who committed crimes used to laugh at those who believed."},{a:30,ar:"وَإِذَا مَرُّوا بِهِمْ يَتَغَامَزُونَ",en:"And when they passed by them, they would wink at one another."},{a:31,ar:"وَإِذَا انقَلَبُوا إِلَىٰ أَهْلِهِمُ انقَلَبُوا فَكِهِينَ",en:"And when they returned to their people, they would return jesting."},{a:32,ar:"وَإِذَا رَأَوْهُمْ قَالُوا إِنَّ هَٰؤُلَاءِ لَضَالُّونَ",en:"And when they saw them, they said, 'Indeed, these are truly astray' —"},{a:33,ar:"وَمَا أُرْسِلُوا عَلَيْهِمْ حَافِظِينَ",en:"though they were not sent as guardians over them."},{a:34,ar:"فَالْيَوْمَ الَّذِينَ آمَنُوا مِنَ الْكُفَّارِ يَضْحَكُونَ",en:"So today it is those who believed who will laugh at the disbelievers,"},{a:35,ar:"عَلَى الْأَرَائِكِ يَنظُرُونَ",en:"on couches, gazing."},{a:36,ar:"هَل ثُوِّبَ الْكُفَّارُ مَا كَانُوا يَفْعَلُونَ",en:"Has the reward of the disbelievers not been for what they used to do?"}],84:[{a:1,ar:"إِذَا السَّمَاءُ انشَقَّتْ",en:"When the sky is split open,"},{a:2,ar:"وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ",en:"and has listened to its Lord, as it was bound to,"},{a:3,ar:"وَإِذَا الْأَرْضُ مُدَّتْ",en:"and when the earth is stretched out,"},{a:4,ar:"وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ",en:"and has cast out what is in it and become empty,"},{a:5,ar:"وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ",en:"and has listened to its Lord, as it was bound to —"},{a:6,ar:"يَا أَيُّهَا الْإِنسَانُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَاقِيهِ",en:"O man, indeed you are laboring toward your Lord with exertion, and you will meet it."},{a:7,ar:"فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ",en:"So as for one who is given his record in his right hand,"},{a:8,ar:"فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا",en:"he will be judged with an easy reckoning,"},{a:9,ar:"وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا",en:"and he will return to his people joyfully."},{a:10,ar:"وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ وَرَاءَ ظَهْرِهِ",en:"But as for one who is given his record behind his back,"},{a:11,ar:"فَسَوْفَ يَدْعُو ثُبُورًا",en:"he will cry out for destruction"},{a:12,ar:"وَيَصْلَىٰ سَعِيرًا",en:"and will burn in a blazing fire."},{a:13,ar:"إِنَّهُ كَانَ فِي أَهْلِهِ مَسْرُورًا",en:"Indeed, he had been, among his people, joyful [in worldly life];"},{a:14,ar:"إِنَّهُ ظَنَّ أَن لَّن يَحُورَ",en:"indeed, he had thought he would never return [to Allah]."},{a:15,ar:"بَلَىٰ إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا",en:"But yes! Indeed, his Lord was ever watching him."},{a:16,ar:"فَلَا أُقْسِمُ بِالشَّفَقِ",en:"So I swear by the twilight glow,"},{a:17,ar:"وَاللَّيْلِ وَمَا وَسَقَ",en:"and by the night and what it gathers,"},{a:18,ar:"وَالْقَمَرِ إِذَا اتَّسَقَ",en:"and by the moon when it becomes full,"},{a:19,ar:"لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ",en:"you will surely pass from stage to stage."},{a:20,ar:"فَمَا لَهُمْ لَا يُؤْمِنُونَ",en:"So what is with them that they do not believe,"},{a:21,ar:"وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ",en:"and when the Quran is recited to them, they do not prostrate?"},{a:22,ar:"بَلِ الَّذِينَ كَفَرُوا يُكَذِّبُونَ",en:"Rather, those who disbelieve deny [it],"},{a:23,ar:"وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَ",en:"and Allah knows best what they are hiding."},{a:24,ar:"فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ",en:"So give them tidings of a painful punishment,"},{a:25,ar:"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ",en:"except those who believe and do righteous deeds — for them is a reward uninterrupted."}],85:[{a:1,ar:"وَالسَّمَاءِ ذَاتِ الْبُرُوجِ",en:"By the sky containing the constellations,"},{a:2,ar:"وَالْيَوْمِ الْمَوْعُودِ",en:"and by the promised Day,"},{a:3,ar:"وَشَاهِدٍ وَمَشْهُودٍ",en:"and by the witness and what is witnessed —"},{a:4,ar:"قُتِلَ أَصْحَابُ الْأُخْدُودِ",en:"cursed were the companions of the trench,"},{a:5,ar:"النَّارِ ذَاتِ الْوَقُودِ",en:"[containing] the fire full of fuel,"},{a:6,ar:"إِذْ هُمْ عَلَيْهَا قُعُودٌ",en:"when they sat by it,"},{a:7,ar:"وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ",en:"witnessing what they were doing to the believers."},{a:8,ar:"وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَن يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ",en:"They resented them for nothing except that they believed in Allah, the Almighty, the Praiseworthy,"},{a:9,ar:"الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ",en:"to whom belongs the dominion of the heavens and the earth. And Allah is a Witness over all things."},{a:10,ar:"إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ",en:"Indeed, those who persecuted the believing men and women and then did not repent will have the punishment of Hell, and they will have the punishment of burning."},{a:11,ar:"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ",en:"Indeed, those who believed and did righteous deeds will have gardens beneath which rivers flow — that is the great success."},{a:12,ar:"إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ",en:"Indeed, the seizure of your Lord is severe."},{a:13,ar:"إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ",en:"Indeed, it is He who originates and repeats [creation],"},{a:14,ar:"وَهُوَ الْغَفُورُ الْوَدُودُ",en:"and He is the Forgiving, the Loving,"},{a:15,ar:"ذُو الْعَرْشِ الْمَجِيدُ",en:"Owner of the Throne, the Glorious,"},{a:16,ar:"فَعَّالٌ لِّمَا يُرِيدُ",en:"Doer of whatever He wills."},{a:17,ar:"هَل أَتَاكَ حَدِيثُ الْجُنُودِ",en:"Has the story of the hosts reached you —"},{a:18,ar:"فِرْعَوْنَ وَثَمُودَ",en:"of Pharaoh and Thamud?"},{a:19,ar:"بَلِ الَّذِينَ كَفَرُوا فِي تَكْذِيبٍ",en:"Yet those who disbelieve persist in denial,"},{a:20,ar:"وَاللَّهُ مِن وَرَائِهِم مُّحِيطٌ",en:"while Allah, from behind them, encompasses them all."},{a:21,ar:"بَلْ هُوَ قُرْآنٌ مَّجِيدٌ",en:"Rather, it is a glorious Quran,"},{a:22,ar:"فِي لَوْحٍ مَّحْفُوظٍ",en:"[inscribed] in a preserved tablet."}],86:[{a:1,ar:"وَالسَّمَاءِ وَالطَّارِقِ",en:"By the sky and the night comer —"},{a:2,ar:"وَمَا أَدْرَاكَ مَا الطَّارِقُ",en:"and what can make you know what the night comer is? —"},{a:3,ar:"النَّجْمُ الثَّاقِبُ",en:"the piercing star."},{a:4,ar:"إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ",en:"There is no soul but that over it is a guardian."},{a:5,ar:"فَلْيَنظُرِ الْإِنسَانُ مِمَّ خُلِقَ",en:"So let man reflect on what he was created from."},{a:6,ar:"خُلِقَ مِن مَّاءٍ دَافِقٍ",en:"He was created from spurting water,"},{a:7,ar:"يَخْرُجُ مِن بَيْنِ الصُّلْبِ وَالتَّرَائِبِ",en:"emerging from between the backbone and the ribs."},{a:8,ar:"إِنَّهُ عَلَىٰ رَجْعِهِ لَقَادِرٌ",en:"Indeed, He is fully able to bring him back [to life]"},{a:9,ar:"يَوْمَ تُبْلَى السَّرَائِرُ",en:"the Day when secrets will be tested,"},{a:10,ar:"فَمَا لَهُ مِن قُوَّةٍ وَلَا نَاصِرٍ",en:"and he will have no power or helper."},{a:11,ar:"وَالسَّمَاءِ ذَاتِ الرَّجْعِ",en:"By the sky which returns [rain],"},{a:12,ar:"وَالْأَرْضِ ذَاتِ الصَّدْعِ",en:"and by the earth which cracks open [for plants] —"},{a:13,ar:"إِنَّهُ لَقَوْلٌ فَصْلٌ",en:"indeed, this [Quran] is a decisive word,"},{a:14,ar:"وَمَا هُوَ بِالْهَزْلِ",en:"and it is not a jest."},{a:15,ar:"إِنَّهُمْ يَكِيدُونَ كَيْدًا",en:"Indeed, they are planning a plan,"},{a:16,ar:"وَأَكِيدُ كَيْدًا",en:"and I too am planning a plan."},{a:17,ar:"فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا",en:"So give the disbelievers respite — give them a little respite."}],87:[{a:1,ar:"سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى",en:"Glorify the name of your Lord, the Most High,"},{a:2,ar:"الَّذِي خَلَقَ فَسَوَّىٰ",en:"who created and proportioned,"},{a:3,ar:"وَالَّذِي قَدَّرَ فَهَدَىٰ",en:"and who determined and guided,"},{a:4,ar:"وَالَّذِي أَخْرَجَ الْمَرْعَىٰ",en:"and who brought forth the pasture,"},{a:5,ar:"فَجَعَلَهُ غُثَاءً أَحْوَىٰ",en:"and then made it dark stubble."},{a:6,ar:"سَنُقْرِئُكَ فَلَا تَنسَىٰ",en:"We will make you recite, and you will not forget,"},{a:7,ar:"إِلَّا مَا شَاءَ اللَّهُ إِنَّهُ يَعْلَمُ الْجَهْرَ وَمَا يَخْفَىٰ",en:"except what Allah wills. Indeed, He knows what is manifest and what is hidden."},{a:8,ar:"وَنُيَسِّرُكَ لِلْيُسْرَىٰ",en:"And We will ease you toward ease."},{a:9,ar:"فَذَكِّرْ إِن نَّفَعَتِ الذِّكْرَىٰ",en:"So remind, if the reminder benefits."},{a:10,ar:"سَيَذَّكَّرُ مَن يَخْشَىٰ",en:"He who fears [Allah] will be reminded,"},{a:11,ar:"وَيَتَجَنَّبُهَا الْأَشْقَى",en:"but the most wretched will avoid it —"},{a:12,ar:"الَّذِي يَصْلَى النَّارَ الْكُبْرَىٰ",en:"he who will burn in the greatest Fire,"},{a:13,ar:"ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ",en:"where he will neither die nor live."},{a:14,ar:"قَد أَفْلَحَ مَن تَزَكَّىٰ",en:"He has certainly succeeded who purifies himself,"},{a:15,ar:"وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ",en:"and remembers the name of his Lord and prays."},{a:16,ar:"بَل تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا",en:"But you prefer the worldly life,"},{a:17,ar:"وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ",en:"while the Hereafter is better and more lasting."},{a:18,ar:"إِنَّ هَٰذَا لَفِي الصُّحُفِ الْأُولَىٰ",en:"Indeed, this is in the former scriptures —"},{a:19,ar:"صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ",en:"the scriptures of Abraham and Moses."}],88:[{a:1,ar:"هَل أَتَاكَ حَدِيثُ الْغَاشِيَةِ",en:"Has the story of the overwhelming event reached you?"},{a:2,ar:"وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ",en:"Some faces, that Day, will be humbled,"},{a:3,ar:"عَامِلَةٌ نَّاصِبَةٌ",en:"toiling and exhausted,"},{a:4,ar:"تَصْلَى نَارًا حَامِيَةً",en:"burning in an intensely hot Fire,"},{a:5,ar:"تُسْقَىٰ مِن عَيْنٍ آنِيَةٍ",en:"given drink from a boiling spring."},{a:6,ar:"لَّيْسَ لَهُم طَعَامٌ إِلَّا مِن ضَرِيعٍ",en:"They will have no food except from a bitter thorny plant,"},{a:7,ar:"لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ",en:"which neither nourishes nor satisfies hunger."},{a:8,ar:"وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ",en:"[Other] faces, that Day, will be joyful,"},{a:9,ar:"لِسَعْيِهَا رَاضِيَةٌ",en:"pleased with their effort,"},{a:10,ar:"فِي جَنَّةٍ عَالِيَةٍ",en:"in an elevated garden,"},{a:11,ar:"لَّا تَسْمَعُ فِيهَا لَاغِيَةً",en:"wherein they will hear no vain talk."},{a:12,ar:"فِيهَا عَيْنٌ جَارِيَةٌ",en:"Within it is a flowing spring,"},{a:13,ar:"فِيهَا سُرُرٌ مَّرْفُوعَةٌ",en:"within it are raised couches,"},{a:14,ar:"وَأَكْوَابٌ مَّوْضُوعَةٌ",en:"and set-out cups,"},{a:15,ar:"وَنَمَارِقُ مَصْفُوفَةٌ",en:"and arranged cushions,"},{a:16,ar:"وَزَرَابِيُّ مَبْثُوثَةٌ",en:"and spread-out carpets."},{a:17,ar:"أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ",en:"Do they not look at the camels, how they were created,"},{a:18,ar:"وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ",en:"and at the sky, how it was raised,"},{a:19,ar:"وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ",en:"and at the mountains, how they were set up,"},{a:20,ar:"وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ",en:"and at the earth, how it was spread out?"},{a:21,ar:"فَذَكِّرْ إِنَّمَا أَنتَ مُذَكِّرٌ",en:"So remind; you are only a reminder."},{a:22,ar:"لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ",en:"You are not over them a controller."},{a:23,ar:"إِلَّا مَن تَوَلَّىٰ وَكَفَرَ",en:"But whoever turns away and disbelieves,"},{a:24,ar:"فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ",en:"Allah will punish him with the greatest punishment."},{a:25,ar:"إِنَّ إِلَيْنَا إِيَابَهُمْ",en:"Indeed, to Us is their return,"},{a:26,ar:"ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم",en:"and then indeed, upon Us is their reckoning."}],89:[{a:1,ar:"وَالْفَجْرِ",en:"By the dawn"},{a:2,ar:"وَلَيَالٍ عَشْرٍ",en:"and by the ten nights"},{a:3,ar:"وَالشَّفْعِ وَالْوَتْرِ",en:"and by the even and the odd"},{a:4,ar:"وَاللَّيْلِ إِذَا يَسْرِ",en:"and by the night when it passes —"},{a:5,ar:"هَل فِي ذَٰلِكَ قَسَمٌ لِّذِي حِجْرٍ",en:"is there not in that an oath for one of understanding?"},{a:6,ar:"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ",en:"Have you not considered how your Lord dealt with 'Aad —"},{a:7,ar:"إِرَمَ ذَاتِ الْعِمَادِ",en:"[the tribe of] Iram, possessors of lofty pillars,"},{a:8,ar:"الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ",en:"the like of whom had never been created in the lands?"},{a:9,ar:"وَثَمُودَ الَّذِينَ جَابُوا الصَّخْرَ بِالْوَادِ",en:"And [how He dealt with] Thamud, who carved out the rocks in the valley,"},{a:10,ar:"وَفِرْعَوْنَ ذِي الْأَوْتَادِ",en:"and Pharaoh, owner of the stakes —"},{a:11,ar:"الَّذِينَ طَغَوْا فِي الْبِلَادِ",en:"[all of] whom transgressed in the lands"},{a:12,ar:"فَأَكْثَرُوا فِيهَا الْفَسَادَ",en:"and increased therein corruption."},{a:13,ar:"فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ",en:"So your Lord poured upon them a scourge of punishment."},{a:14,ar:"إِنَّ رَبَّكَ لَبِالْمِرْصَادِ",en:"Indeed, your Lord is ever watchful."},{a:15,ar:"فَأَمَّا الْإِنسَانُ إِذَا مَا ابْتَلَاهُ رَبُّهُ فَأَكْرَمَهُ وَنَعَّمَهُ فَيَقُولُ رَبِّي أَكْرَمَنِ",en:"As for man, when his Lord tests him by generosity and favor, he says, 'My Lord has honored me.'"},{a:16,ar:"وَأَمَّا إِذَا مَا ابْتَلَاهُ فَقَدَرَ عَلَيْهِ رِزْقَهُ فَيَقُولُ رَبِّي أَهَانَنِ",en:"But when He tests him by restricting his provision, he says, 'My Lord has humiliated me.'"},{a:17,ar:"كَلَّا بَل لَّا تُكْرِمُونَ الْيَتِيمَ",en:"No! But you do not honor the orphan,"},{a:18,ar:"وَلَا تَحَاضُّونَ عَلَىٰ طَعَامِ الْمِسْكِينِ",en:"and you do not encourage one another to feed the poor,"},{a:19,ar:"وَتَأْكُلُونَ التُّرَاثَ أَكْلًا لَّمًّا",en:"and you consume inheritance, devouring it greedily,"},{a:20,ar:"وَتُحِبُّونَ الْمَالَ حُبًّا جَمًّا",en:"and you love wealth with excessive love."},{a:21,ar:"كَلَّا إِذَا دُكَّتِ الْأَرْضُ دَكًّا دَكًّا",en:"No! When the earth is pounded, pounded and leveled,"},{a:22,ar:"وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا",en:"and your Lord comes, with the angels, rank upon rank,"},{a:23,ar:"وَجِيءَ يَوْمَئِذٍ بِجَهَنَّمَ يَوْمَئِذٍ يَتَذَكَّرُ الْإِنسَانُ وَأَنَّىٰ لَهُ الذِّكْرَىٰ",en:"and Hell, that Day, is brought — that Day man will remember, but what good will remembrance do him then?"},{a:24,ar:"يَقُولُ يَا لَيْتَنِي قَدَّمْتُ لِحَيَاتِي",en:"He will say, 'Oh, I wish I had sent forth [good deeds] for my life!'"},{a:25,ar:"فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُ أَحَدٌ",en:"So that Day, none will punish as He punishes,"},{a:26,ar:"وَلَا يُوثِقُ وَثَاقَهُ أَحَدٌ",en:"and none will bind as He binds."},{a:27,ar:"يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ",en:"[To the righteous it will be said], 'O reassured soul,"},{a:28,ar:"ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً",en:"return to your Lord, well-pleased and pleasing [to Him],"},{a:29,ar:"فَادْخُلِي فِي عِبَادِي",en:"and enter among My servants,"},{a:30,ar:"وَادْخُلِي جَنَّتِي",en:"and enter My Paradise.'"}],90:[{a:1,ar:"لَا أُقْسِمُ بِهَٰذَا الْبَلَدِ",en:"I swear by this city,"},{a:2,ar:"وَأَنتَ حِلٌّ بِهَٰذَا الْبَلَدِ",en:"and you are free to dwell in this city,"},{a:3,ar:"وَوَالِدٍ وَمَا وَلَدَ",en:"and by the father and what he begot,"},{a:4,ar:"لَقَد خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ",en:"We have certainly created man into hardship."},{a:5,ar:"أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ",en:"Does he think that no one has power over him?"},{a:6,ar:"يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا",en:"He says, 'I have spent abundant wealth.'"},{a:7,ar:"أَيَحْسَبُ أَن لَّمْ يَرَهُ أَحَدٌ",en:"Does he think that no one has seen him?"},{a:8,ar:"أَلَمْ نَجْعَل لَّهُ عَيْنَيْنِ",en:"Have We not made for him two eyes,"},{a:9,ar:"وَلِسَانًا وَشَفَتَيْنِ",en:"and a tongue and two lips,"},{a:10,ar:"وَهَدَيْنَاهُ النَّجْدَيْنِ",en:"and shown him the two ways [of good and evil]?"},{a:11,ar:"فَلَا اقْتَحَمَ الْعَقَبَةَ",en:"But he has not attempted the steep path."},{a:12,ar:"وَمَا أَدْرَاكَ مَا الْعَقَبَةُ",en:"And what can make you know what the steep path is?"},{a:13,ar:"فَكُّ رَقَبَةٍ",en:"It is the freeing of a slave,"},{a:14,ar:"أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ",en:"or feeding on a day of hunger"},{a:15,ar:"يَتِيمًا ذَا مَقْرَبَةٍ",en:"an orphan near of kin,"},{a:16,ar:"أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ",en:"or a poor person in destitution,"},{a:17,ar:"ثُمَّ كَانَ مِنَ الَّذِينَ آمَنُوا وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ",en:"and then being among those who believe and advise one another to patience and advise one another to mercy."},{a:18,ar:"أُولَٰئِكَ أَصْحَابُ الْمَيْمَنَةِ",en:"Those are the companions of the right."},{a:19,ar:"وَالَّذِينَ كَفَرُوا بِآيَاتِنَا هُمْ أَصْحَابُ الْمَشْأَمَةِ",en:"But those who disbelieve in Our signs — they are the companions of the left."},{a:20,ar:"عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌ",en:"Over them will be a Fire closed in."}],91:[{a:1,ar:"وَالشَّمْسِ وَضُحَاهَا",en:"By the sun and its brightness,"},{a:2,ar:"وَالْقَمَرِ إِذَا تَلَاهَا",en:"and by the moon when it follows it,"},{a:3,ar:"وَالنَّهَارِ إِذَا جَلَّاهَا",en:"and by the day when it displays it,"},{a:4,ar:"وَاللَّيْلِ إِذَا يَغْشَاهَا",en:"and by the night when it covers it,"},{a:5,ar:"وَالسَّمَاءِ وَمَا بَنَاهَا",en:"and by the sky and He who built it,"},{a:6,ar:"وَالْأَرْضِ وَمَا طَحَاهَا",en:"and by the earth and He who spread it out,"},{a:7,ar:"وَنَفْسٍ وَمَا سَوَّاهَا",en:"and by the soul and He who formed it"},{a:8,ar:"فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا",en:"and inspired it with its wickedness and its righteousness —"},{a:9,ar:"قَد أَفْلَحَ مَن زَكَّاهَا",en:"he has certainly succeeded who purifies it,"},{a:10,ar:"وَقَد خَابَ مَن دَسَّاهَا",en:"and he has certainly failed who corrupts it."},{a:11,ar:"كَذَّبَتْ ثَمُودُ بِطَغْوَاهَا",en:"Thamud denied [their prophet] out of their transgression,"},{a:12,ar:"إِذِ انبَعَثَ أَشْقَاهَا",en:"when the most wretched among them was sent forth."},{a:13,ar:"فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا",en:"And the messenger of Allah said to them, 'Do not touch the she-camel of Allah, nor her drink.'"},{a:14,ar:"فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنبِهِمْ فَسَوَّاهَا",en:"But they denied him and hamstrung her, so their Lord crushed them for their sin and leveled them,"},{a:15,ar:"وَلَا يَخَافُ عُقْبَاهَا",en:"and He does not fear its consequence."}],92:[{a:1,ar:"وَاللَّيْلِ إِذَا يَغْشَىٰ",en:"By the night when it covers,"},{a:2,ar:"وَالنَّهَارِ إِذَا تَجَلَّىٰ",en:"and by the day when it appears,"},{a:3,ar:"وَمَا خَلَقَ الذَّكَرَ وَالْأُنثَىٰ",en:"and by He who created the male and the female —"},{a:4,ar:"إِنَّ سَعْيَكُمْ لَشَتَّىٰ",en:"indeed, your efforts are diverse."},{a:5,ar:"فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ",en:"As for one who gives and fears Allah,"},{a:6,ar:"وَصَدَّقَ بِالْحُسْنَىٰ",en:"and believes in the best,"},{a:7,ar:"فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ",en:"We will ease him toward ease."},{a:8,ar:"وَأَمَّا مَن بَخِلَ وَاسْتَغْنَىٰ",en:"But as for one who withholds and considers himself free of need,"},{a:9,ar:"وَكَذَّبَ بِالْحُسْنَىٰ",en:"and denies the best,"},{a:10,ar:"فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ",en:"We will ease him toward difficulty."},{a:11,ar:"وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ",en:"And his wealth will not benefit him when he falls [into ruin]."},{a:12,ar:"إِنَّ عَلَيْنَا لَلْهُدَىٰ",en:"Indeed, upon Us is guidance,"},{a:13,ar:"وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَىٰ",en:"and indeed, to Us belong the last [life] and the first."},{a:14,ar:"فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ",en:"So I have warned you of a blazing Fire,"},{a:15,ar:"لَا يَصْلَاهَا إِلَّا الْأَشْقَى",en:"in which none will burn except the most wretched,"},{a:16,ar:"الَّذِي كَذَّبَ وَتَوَلَّىٰ",en:"who denies and turns away."},{a:17,ar:"وَسَيُجَنَّبُهَا الْأَتْقَى",en:"But the most righteous will be spared from it —"},{a:18,ar:"الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّىٰ",en:"he who gives his wealth, purifying himself,"},{a:19,ar:"وَمَا لِأَحَدٍ عِندَهُ مِن نِعْمَةٍ يُجْزَىٰ",en:"not [giving] for anyone's favor to be rewarded,"},{a:20,ar:"إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ",en:"but only seeking the face of his Lord, the Most High."},{a:21,ar:"وَلَسَوْفَ يَرْضَىٰ",en:"And he will surely be satisfied."}],93:[{a:1,ar:"وَالضُّحَىٰ",en:"By the morning brightness"},{a:2,ar:"وَاللَّيْلِ إِذَا سَجَىٰ",en:"and by the night when it stills —"},{a:3,ar:"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ",en:"your Lord has not forsaken you, nor has He become displeased."},{a:4,ar:"وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ",en:"And the Hereafter is better for you than the first [life]."},{a:5,ar:"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ",en:"And your Lord is going to give you, and you will be satisfied."},{a:6,ar:"أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ",en:"Did He not find you an orphan and give you shelter?"},{a:7,ar:"وَوَجَدَكَ ضَالًّا فَهَدَىٰ",en:"And He found you astray and guided you."},{a:8,ar:"وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ",en:"And He found you poor and made you self-sufficient."},{a:9,ar:"فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ",en:"So as for the orphan, do not oppress him,"},{a:10,ar:"وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ",en:"and as for the one who asks, do not repel him,"},{a:11,ar:"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ",en:"and as for the favor of your Lord, proclaim it."}],94:[{a:1,ar:"أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ",en:"Have We not expanded for you your chest?"},{a:2,ar:"وَوَضَعْنَا عَنكَ وِزْرَكَ",en:"And We removed from you your burden,"},{a:3,ar:"الَّذِي أَنقَضَ ظَهْرَكَ",en:"which weighed down your back,"},{a:4,ar:"وَرَفَعْنَا لَكَ ذِكْرَكَ",en:"and We raised for you your renown."},{a:5,ar:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا",en:"So indeed, with hardship comes ease;"},{a:6,ar:"إِنَّ مَعَ الْعُسْرِ يُسْرًا",en:"indeed, with hardship comes ease."},{a:7,ar:"فَإِذَا فَرَغْتَ فَانصَبْ",en:"So when you are free, strive [in devotion],"},{a:8,ar:"وَإِلَىٰ رَبِّكَ فَارْغَبْ",en:"and to your Lord turn your attention."}],95:[{a:1,ar:"وَالتِّينِ وَالزَّيْتُونِ",en:"By the fig and the olive,"},{a:2,ar:"وَطُورِ سِينِينَ",en:"and by Mount Sinai,"},{a:3,ar:"وَهَٰذَا الْبَلَدِ الْأَمِينِ",en:"and by this secure city —"},{a:4,ar:"لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ",en:"We have certainly created man in the best of forms,"},{a:5,ar:"ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ",en:"then We return him to the lowest of the low,"},{a:6,ar:"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ",en:"except those who believe and do righteous deeds — for them is a reward uninterrupted."},{a:7,ar:"فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ",en:"So what causes you to deny the Judgment after this?"},{a:8,ar:"أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ",en:"Is Allah not the most just of judges?"}],96:[{a:1,ar:"اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ",en:"Read in the name of your Lord who created —"},{a:2,ar:"خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ",en:"created man from a clinging clot."},{a:3,ar:"اقْرَأْ وَرَبُّكَ الْأَكْرَمُ",en:"Read, and your Lord is the most Generous,"},{a:4,ar:"الَّذِي عَلَّمَ بِالْقَلَمِ",en:"who taught by the pen,"},{a:5,ar:"عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ",en:"taught man that which he knew not."},{a:6,ar:"كَلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ",en:"No! Indeed, man transgresses"},{a:7,ar:"أَن رَّآهُ اسْتَغْنَىٰ",en:"because he sees himself self-sufficient."},{a:8,ar:"إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ",en:"Indeed, to your Lord is the return."},{a:9,ar:"أَرَأَيْتَ الَّذِي يَنْهَىٰ",en:"Have you seen the one who forbids"},{a:10,ar:"عَبْدًا إِذَا صَلَّىٰ",en:"a servant when he prays?"},{a:11,ar:"أَرَأَيْتَ إِن كَانَ عَلَى الْهُدَىٰ",en:"Have you seen if he is upon guidance"},{a:12,ar:"أَوْ أَمَرَ بِالتَّقْوَىٰ",en:"or enjoins righteousness?"},{a:13,ar:"أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ",en:"Have you seen if he denies and turns away?"},{a:14,ar:"أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ",en:"Does he not know that Allah sees?"},{a:15,ar:"كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ",en:"No! If he does not desist, We will surely drag him by the forelock,"},{a:16,ar:"نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ",en:"a lying, sinning forelock."},{a:17,ar:"فَلْيَدْعُ نَادِيَهُ",en:"Then let him call his associates;"},{a:18,ar:"سَنَدْعُ الزَّبَانِيَةَ",en:"We will call the angels of Hell."},{a:19,ar:"كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب",en:"No! Do not obey him. But prostrate and draw near [to Allah]."}],97:[{a:1,ar:"إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ",en:"Indeed, We sent it down during the Night of Decree."},{a:2,ar:"وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ",en:"And what can make you know what the Night of Decree is?"},{a:3,ar:"لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ",en:"The Night of Decree is better than a thousand months."},{a:4,ar:"تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ",en:"The angels and the Spirit descend during it, by permission of their Lord, for every matter."},{a:5,ar:"سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ",en:"Peace it is until the emergence of dawn."}],98:[{a:1,ar:"لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ",en:"Those who disbelieved among the People of the Scripture and the polytheists were not going to depart [from disbelief] until there came to them clear evidence —"},{a:2,ar:"رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً",en:"a messenger from Allah, reciting purified scriptures,"},{a:3,ar:"فِيهَا كُتُبٌ قَيِّمَةٌ",en:"containing correct writings."},{a:4,ar:"وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ",en:"Nor did those who were given the Scripture become divided until after clear evidence had come to them."},{a:5,ar:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ",en:"And they were not commanded except to worship Allah, sincere to Him in religion, being upright, and to establish prayer and give charity — and that is the correct religion."},{a:6,ar:"إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا أُولَٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ",en:"Indeed, those who disbelieved among the People of the Scripture and the polytheists will be in the fire of Hell, abiding therein forever. They are the worst of creatures."},{a:7,ar:"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ",en:"Indeed, those who believed and did righteous deeds — they are the best of creatures."},{a:8,ar:"جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ",en:"Their reward with their Lord is gardens of eternity beneath which rivers flow, wherein they will abide forever, Allah being pleased with them and they with Him. That is for whoever has feared his Lord."}],99:[{a:1,ar:"إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا",en:"When the earth is shaken with its [final] earthquake,"},{a:2,ar:"وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا",en:"and the earth discharges its burdens,"},{a:3,ar:"وَقَالَ الْإِنسَانُ مَا لَهَا",en:"and man says, 'What is with it?' —"},{a:4,ar:"يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا",en:"that Day it will report its news,"},{a:5,ar:"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا",en:"because your Lord has inspired it."},{a:6,ar:"يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ",en:"That Day, mankind will proceed in scattered groups to be shown their deeds."},{a:7,ar:"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ",en:"So whoever does an atom's weight of good will see it,"},{a:8,ar:"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ",en:"and whoever does an atom's weight of evil will see it."}],100:[{a:1,ar:"وَالْعَادِيَاتِ ضَبْحًا",en:"By the racers, panting,"},{a:2,ar:"فَالْمُورِيَاتِ قَدْحًا",en:"and the strikers of sparks,"},{a:3,ar:"فَالْمُغِيرَاتِ صُبْحًا",en:"and the chargers at dawn,"},{a:4,ar:"فَأَثَرْنَ بِهِ نَقْعًا",en:"stirring up thereby a cloud of dust,"},{a:5,ar:"فَوَسَطْنَ بِهِ جَمْعًا",en:"penetrating thereby a host —"},{a:6,ar:"إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ",en:"indeed, man is ungrateful to his Lord,"},{a:7,ar:"وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ",en:"and indeed, he is a witness to that,"},{a:8,ar:"وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ",en:"and indeed, he is intense in love of wealth."},{a:9,ar:"أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ",en:"Does he not know that when what is in the graves is overturned"},{a:10,ar:"وَحُصِّلَ مَا فِي الصُّدُورِ",en:"and what is in the breasts is made apparent,"},{a:11,ar:"إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ",en:"indeed, their Lord, that Day, is fully aware of them?"}],101:[{a:1,ar:"الْقَارِعَةُ",en:"The Calamity —"},{a:2,ar:"مَا الْقَارِعَةُ",en:"what is the Calamity?"},{a:3,ar:"وَمَا أَدْرَاكَ مَا الْقَارِعَةُ",en:"And what can make you know what the Calamity is?"},{a:4,ar:"يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ",en:"It is the Day when people will be like scattered moths,"},{a:5,ar:"وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ",en:"and the mountains will be like carded wool."},{a:6,ar:"فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ",en:"Then as for one whose scales are heavy [with good deeds],"},{a:7,ar:"فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ",en:"he will be in a pleasant life."},{a:8,ar:"وَأَمَّا مَن خَفَّتْ مَوَازِينُهُ",en:"But as for one whose scales are light,"},{a:9,ar:"فَأُمُّهُ هَاوِيَةٌ",en:"his refuge will be the Abyss."},{a:10,ar:"وَمَا أَدْرَاكَ مَا هِيَهْ",en:"And what can make you know what it is?"},{a:11,ar:"نَارٌ حَامِيَةٌ",en:"A raging Fire."}],102:[{a:1,ar:"أَلْهَاكُمُ التَّكَاثُرُ",en:"Competing for increase diverts you"},{a:2,ar:"حَتَّىٰ زُرْتُمُ الْمَقَابِرَ",en:"until you visit the graves."},{a:3,ar:"كَلَّا سَوْفَ تَعْلَمُونَ",en:"No! You are going to know."},{a:4,ar:"ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ",en:"Then, again, no! You are going to know."},{a:5,ar:"كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ",en:"No! If only you knew with certain knowledge,"},{a:6,ar:"لَتَرَوُنَّ الْجَحِيمَ",en:"you would surely see the Blazing Fire."},{a:7,ar:"ثُمَّ لَتَرَوْنَهَا عَيْنَ الْيَقِينِ",en:"Then you will surely see it with the eye of certainty."},{a:8,ar:"ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ",en:"Then you will surely be asked, that Day, about the pleasure [you enjoyed]."}],103:[{a:1,ar:"وَالْعَصْرِ",en:"By time,"},{a:2,ar:"إِنَّ الْإِنسَانَ لَفِي خُسْرٍ",en:"indeed, mankind is in loss,"},{a:3,ar:"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ",en:"except those who believe and do righteous deeds and advise one another to truth and advise one another to patience."}],104:[{a:1,ar:"وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ",en:"Woe to every scorning slanderer and backbiter,"},{a:2,ar:"الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ",en:"who gathers wealth and counts it,"},{a:3,ar:"يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ",en:"thinking that his wealth will make him immortal."},{a:4,ar:"كَلَّا لَيُنبَذَنَّ فِي الْحُطَمَةِ",en:"No! He will surely be thrown into the Crusher."},{a:5,ar:"وَمَا أَدْرَاكَ مَا الْحُطَمَةُ",en:"And what can make you know what the Crusher is?"},{a:6,ar:"نَارُ اللَّهِ الْمُوقَدَةُ",en:"It is the Fire of Allah, kindled,"},{a:7,ar:"الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ",en:"which rises over the hearts."},{a:8,ar:"إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ",en:"Indeed, it will be closed down upon them,"},{a:9,ar:"فِي عَمَدٍ مُّمَدَّدَةٍ",en:"in extended columns."}],105:[{a:1,ar:"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ",en:"Have you not considered how your Lord dealt with the companions of the elephant?"},{a:2,ar:"أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ",en:"Did He not make their plan go astray?"},{a:3,ar:"وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ",en:"And He sent against them birds in flocks,"},{a:4,ar:"تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ",en:"striking them with stones of baked clay,"},{a:5,ar:"فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ",en:"and He made them like eaten straw."}],106:[{a:1,ar:"لِإِيلَافِ قُرَيْشٍ",en:"For the accustomed security of the Quraysh —"},{a:2,ar:"إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ",en:"their accustomed security in the caravan of winter and summer —"},{a:3,ar:"فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ",en:"let them worship the Lord of this House,"},{a:4,ar:"الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ",en:"who has fed them, saving them from hunger, and made them secure, saving them from fear."}],107:[{a:1,ar:"أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ",en:"Have you seen the one who denies the Judgment?"},{a:2,ar:"فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ",en:"That is the one who mistreats the orphan"},{a:3,ar:"وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ",en:"and does not encourage the feeding of the poor."},{a:4,ar:"فَوَيْلٌ لِّلْمُصَلِّينَ",en:"So woe to those who pray"},{a:5,ar:"الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ",en:"but are heedless of their prayer,"},{a:6,ar:"الَّذِينَ هُمْ يُرَاءُونَ",en:"who do it only to be seen,"},{a:7,ar:"وَيَمْنَعُونَ الْمَاعُونَ",en:"and withhold [simple] assistance."}],108:[{a:1,ar:"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ",en:"Indeed, We have given you abundance."},{a:2,ar:"فَصَلِّ لِرَبِّكَ وَانْحَرْ",en:"So pray to your Lord and sacrifice."},{a:3,ar:"إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ",en:"Indeed, it is your enemy who is cut off."}],109:[{a:1,ar:"قُلْ يَا أَيُّهَا الْكَافِرُونَ",en:"Say, 'O disbelievers,"},{a:2,ar:"لَا أَعْبُدُ مَا تَعْبُدُونَ",en:"I do not worship what you worship,"},{a:3,ar:"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ",en:"nor are you worshippers of what I worship."},{a:4,ar:"وَلَا أَنَا عَابِدٌ مَّا عَبَدْتُّمْ",en:"Nor will I worship what you have worshipped,"},{a:5,ar:"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ",en:"nor will you worship what I worship."},{a:6,ar:"لَكُمْ دِينُكُمْ وَلِيَ دِينِ",en:"For you is your religion, and for me is my religion.'"}],110:[{a:1,ar:"إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ",en:"When the victory of Allah has come and the conquest,"},{a:2,ar:"وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا",en:"and you see the people entering into the religion of Allah in multitudes,"},{a:3,ar:"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا",en:"then exalt Him with praise of your Lord and ask forgiveness of Him. Indeed, He is ever accepting of repentance."}],111:[{a:1,ar:"تَبَّتْ يَدَا أَبِي لَ
